<div class="detail-grid" role="list">
  <mat-card appearance="outlined" role="listitem">
    <mat-card-header>
      <mat-card-title class="eyebrow">Info</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if(info()) {
      <p><span class="detail-label">applicationName: </span> <span class="detail-value">{{info()?.applicationName}}</span></p>
      <p><span class="detail-label">version: </span> <span class="detail-value">{{info()?.version}}</span></p>
      <p><span class="detail-label">database: </span> <span class="detail-value">{{info()?.database}}</span></p>
      <p><span class="detail-label">databaseSchemaVersion: </span> <span class="detail-value">{{info()?.databaseSchemaVersion}}</span></p>
      <p><span class="detail-label">status: </span> <span class="detail-value">{{info()?.status}}</span></p>
      }
    </mat-card-content>
  </mat-card>
</div>
