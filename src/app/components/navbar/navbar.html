<mat-toolbar class="app-fxLayout app-row app-center-y">
  <a mat-button class="brand" routerLink="/" aria-label="Metacheck home">
    Metacheck
  </a>
  <span class="app-fxFlex" aria-hidden="true"></span>
  <nav>
    @for (item of navItems; track item.path) {
      <a mat-button [routerLink]="item.path" routerLinkActive="app-active" [routerLinkActiveOptions]="{ exact: item.exact }" ariaCurrentWhenActive="page">
        {{ item.label }}
      </a>
    }
  </nav>
</mat-toolbar>
