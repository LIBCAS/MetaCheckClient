<h2 mat-dialog-title>O aplikaci</h2>
<mat-dialog-content>
  @if(info()) {
    <div>Jméno aplikace: <strong>{{info()?.applicationName}}</strong></div>
    <div>Verze: <strong>{{info()?.version}}</strong></div>
    <div>Databáze: <strong>{{info()?.database}}</strong></div>
    <div>Verze schématu databáze: <strong>{{info()?.databaseSchemaVersion}}</strong></div>
    <div>Stav: <strong>{{info()?.status}}</strong></div>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton mat-dialog-close>Zavřít</button>
</mat-dialog-actions>
